groups:
  - name: tasksphere-devops-recording-rules
    interval: 15s
    rules:
      - record: tasksphere:application_cpu_usage_cores
        expr: |
          1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: tasksphere:application_memory_working_set_bytes
        expr: |
          node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
      - record: tasksphere:application_restarts_total
        expr: |
          sum by (namespace, pod) (
            kube_pod_container_status_restarts_total{
              pod=~".*"
            }
          )
      - record: tasksphere:application_ready
        expr: |
          max by (namespace, pod) (
            kube_pod_status_ready{
              pod=~".*",
              condition="true"
            }
          )
      - record: tasksphere:application_network_receive_bytes_per_second
        expr: |
          sum by (namespace, pod) (
            rate(container_network_receive_bytes_total{
              container!="",
              container!="POD",
              pod=~".*"
            }[5m])
          )
      - record: tasksphere:application_network_transmit_bytes_per_second
        expr: |
          sum by (namespace, pod) (
            rate(container_network_transmit_bytes_total{
              container!="",
              container!="POD",
              pod=~".*"
            }[5m])
          )

  - name: tasksphere-devops-alerts
    interval: 30s
    rules:
      - alert: TaskSphereApplicationNotReady
        expr: tasksphere:application_ready == 0
        for: 2m
        labels:
          severity: critical
          application: tasksphere-devops
        annotations:
          summary: "TaskSphere application pod is not ready"
          description: "The TaskSphere application pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready."
      - alert: TaskSphereApplicationHighCpu
        expr: tasksphere:application_cpu_usage_cores > 0.8
        for: 5m
        labels:
          severity: warning
          application: tasksphere-devops
        annotations:
          summary: "TaskSphere application CPU is high"
          description: "The TaskSphere application pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 0.8 CPU cores."
      - alert: TaskSphereApplicationHighMemory
        expr: tasksphere:application_memory_working_set_bytes > 536870912
        for: 5m
        labels:
          severity: warning
          application: tasksphere-devops
        annotations:
          summary: "TaskSphere application memory is high"
          description: "The TaskSphere application pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 512 MiB."
      - alert: TaskSphereApplicationRestarted
        expr: increase(tasksphere:application_restarts_total[15m]) > 0
        for: 2m
        labels:
          severity: warning
          application: tasksphere-devops
        annotations:
          summary: "TaskSphere application pod restarted"
          description: "The TaskSphere application pod {{ $labels.namespace }}/{{ $labels.pod }} restarted recently."
