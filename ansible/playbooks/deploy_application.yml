---
- name: Deploy Application on Minikube
  hosts: terraform_servers
  become: yes

  vars:
    aws_region: eu-north-1
    aws_account_id: "251376345669"
    ecr_repository: terraform-devops-ecr

    image_tag: ""

    ecr_registry: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
    image_name: "{{ ecr_registry }}/{{ ecr_repository }}:{{ image_tag }}"

  tasks:

    # =========================================================
    # 1. Validate Image Tag
    # =========================================================

    - name: Check image tag
      fail:
        msg: "IMAGE TAG was not provided by Jenkins."
      when: image_tag | length == 0


    - name: Display image information
      debug:
        msg:
          - "ECR Registry: {{ ecr_registry }}"
          - "Repository: {{ ecr_repository }}"
          - "Image Tag: {{ image_tag }}"
          - "Image: {{ image_name }}"


    # =========================================================
    # 2. Check Minikube
    # =========================================================

    - name: Check Minikube status
      become: false
      command: minikube status
      register: minikube_status
      changed_when: false
      failed_when: false


    - name: Display Minikube status
      debug:
        var: minikube_status.stdout_lines


    # =========================================================
    # 3. Start Minikube if required
    # =========================================================

    - name: Start Minikube
      become: false
      command: minikube start --driver=docker
      when: "'Running' not in minikube_status.stdout"


    - name: Wait for Minikube
      become: false
      command: minikube status
      register: minikube_running
      retries: 12
      delay: 10
      until: "'Running' in minikube_running.stdout"
      changed_when: false


    # =========================================================
    # 4. Verify Kubernetes
    # =========================================================

    - name: Check Kubernetes nodes
      become: false
      command: kubectl get nodes
      register: kubernetes_nodes
      changed_when: false


    - name: Display Kubernetes nodes
      debug:
        var: kubernetes_nodes.stdout_lines


    # =========================================================
    # 5. Login to ECR
    # =========================================================

    - name: Login to Amazon ECR
      become: false
      shell: |
        aws ecr get-login-password --region {{ aws_region }} |
        docker login \
          --username AWS \
          --password-stdin {{ ecr_registry }}
      changed_when: false


    # =========================================================
    # 6. Pull Numbered Image from ECR
    # =========================================================

    - name: Pull application image from ECR
      become: false
      command: docker pull {{ image_name }}
      register: docker_pull


    - name: Display pulled image
      debug:
        var: docker_pull.stdout_lines


    # =========================================================
    # 7. Load Image into Minikube
    # =========================================================

    - name: Load application image into Minikube
      become: false
      command: minikube image load {{ image_name }}
      register: minikube_image_load


    - name: Display Minikube image load result
      debug:
        var: minikube_image_load.stdout_lines


    # =========================================================
    # 8. Apply Kubernetes Deployment
    # =========================================================

    - name: Copy Kubernetes deployment manifest
      become: false
      copy:
        src: ../Kubernetes/deployment.yml
        dest: /tmp/terraform-devops-deployment.yml
        owner: ubuntu
        mode: '0644'

    - name: Apply Kubernetes deployment
      become: false
      command: kubectl apply -f /tmp/terraform-devops-deployment.yml

    - name: Set application image before continuing
      become: false
      command: >
        kubectl set image deployment/terraform-devops-app
        terraform-devops-app={{ image_name }}


    # =========================================================
    # 9. Apply Kubernetes Service
    # =========================================================

    - name: Copy Kubernetes service manifest
      become: false
      copy:
        src: ../Kubernetes/Service.yml
        dest: /tmp/terraform-devops-service.yml
        owner: ubuntu
        mode: '0644'

    - name: Apply Kubernetes service
      become: false
      command: kubectl apply -f /tmp/terraform-devops-service.yml


    # =========================================================
    # 10. Deploy Prometheus monitoring
    # =========================================================

    - name: Copy Prometheus manifest
      become: false
      copy:
        src: ../Kubernetes/prometheus.yml
        dest: /tmp/prometheus.yml
        owner: ubuntu
        mode: '0644'

    - name: Apply Prometheus manifest
      become: false
      command: kubectl apply -f /tmp/prometheus.yml

    - name: Wait for kube-state-metrics rollout
      become: false
      command: >
        kubectl rollout status deployment/kube-state-metrics
        --timeout=180s

    - name: Restart Prometheus after configuration update
      become: false
      command: kubectl rollout restart deployment/prometheus

    - name: Wait for Prometheus rollout
      become: false
      command: >
        kubectl rollout status deployment/prometheus
        --timeout=180s

    - name: Copy Grafana manifest
      become: false
      copy:
        src: ../Kubernetes/grafana.yml
        dest: /tmp/grafana.yml
        owner: ubuntu
        mode: '0644'

    - name: Apply Grafana manifest
      become: false
      command: kubectl apply -f /tmp/grafana.yml

    - name: Restart Grafana after dashboard update
      become: false
      command: kubectl rollout restart deployment/grafana

    - name: Wait for Grafana rollout
      become: false
      command: >
        kubectl rollout status deployment/grafana
        --timeout=180s


    # =========================================================
    # 11. Expose Prometheus through EC2 Nginx
    # =========================================================

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Get Minikube IP for Prometheus proxy
      become: false
      command: minikube ip
      register: prometheus_minikube_ip
      changed_when: false

    - name: Verify Minikube IP was detected
      assert:
        that:
          - prometheus_minikube_ip.stdout | trim | length > 0
        fail_msg: "Minikube IP could not be detected; refusing to create an invalid Nginx proxy."

    - name: Configure Nginx Prometheus proxy
      template:
        src: ../templates/prometheus-nginx.conf.j2
        dest: /etc/nginx/sites-available/prometheus
        owner: root
        group: root
        mode: '0644'

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Remove legacy Terraform Nginx site
      file:
        path: /etc/nginx/sites-enabled/terraform-devops
        state: absent

    - name: Enable Nginx Prometheus proxy
      file:
        src: /etc/nginx/sites-available/prometheus
        dest: /etc/nginx/sites-enabled/prometheus
        state: link
        force: true

    - name: Validate Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
        enabled: true


    # =========================================================
    # 12. Wait for Rollout
    # =========================================================

    - name: Wait for application rollout
      become: false
      command: >
        kubectl rollout status
        deployment/terraform-devops-app
        --timeout=180s


    # =========================================================
    # 13. Show Pods
    # =========================================================

    - name: Show application pods
      become: false
      command: kubectl get pods -o wide
      register: application_pods
      changed_when: false


    - name: Display application pods
      debug:
        var: application_pods.stdout_lines


    # =========================================================
    # 14. Show Service
    # =========================================================

    - name: Show application service
      become: false
      command: kubectl get service terraform-devops-service
      register: application_service
      changed_when: false


    - name: Display application service
      debug:
        var: application_service.stdout_lines


    # =========================================================
    # 15. Get Minikube IP
    # =========================================================

    - name: Get Minikube IP
      become: false
      command: minikube ip
      register: minikube_ip
      changed_when: false


    - name: Display Minikube IP
      debug:
        msg: "Minikube IP = {{ minikube_ip.stdout }}"


    # =========================================================
    # 16. Get NodePort
    # =========================================================

    - name: Get application NodePort
      become: false
      command: >
        kubectl get service terraform-devops-service
        -o jsonpath='{.spec.ports[0].nodePort}'
      register: application_nodeport
      changed_when: false


    - name: Display application URL
      debug:
        msg: >
          Application URL =
          http://{{ minikube_ip.stdout }}:{{ application_nodeport.stdout }}