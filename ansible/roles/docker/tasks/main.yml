---
- name: Wait for apt lock to be released
  shell: |
    while pgrep -x apt-get >/dev/null 2>&1 || pgrep -x dpkg >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/dpkg/lock >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  changed_when: false
  register: apt_lock_wait
  retries: 20
  delay: 5
  until: apt_lock_wait is succeeded

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 600
  retries: 5
  delay: 10
  register: apt_update
  until: apt_update is succeeded

- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    lock_timeout: 600
  retries: 5
  delay: 10
  register: docker_prereqs
  until: docker_prereqs is succeeded

- name: Download Docker install script
  get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: '0755'

- name: Install Docker
  command: sh /tmp/get-docker.sh

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Verify Docker Installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Show Docker Version
  debug:
    var: docker_version.stdout